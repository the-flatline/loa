// loa — the body's wire contract.
//
// ONE schema. loa-cortex publishes these; everything that needs data
// SUBSCRIBES to the topic. The cortex does not fan out private copies for the
// feed, RAM and the DB — that is three things that can drift.
//
// If a publisher and a subscriber disagree about the shape, that must FAIL
// LOUDLY. Never decode into plausible rubbish. That exact failure cost an hour
// of hunting phantom LEDs on 2026-09-12: a hex-encoded ring frame was base64
// decoded and produced a right-SIZED, entirely wrong answer, which read as
// hardware.
//
// BUMP SCHEMA_VERSION (loa/topic.py) on any change here.

syntax = "proto3";

package loa;

// One published message. The version travels with every message so a mismatched
// consumer fails on arrival instead of misreading fields.
message Envelope {
  uint32 schema_version = 1;

  oneof body {
    State state = 2;   // state changed — the live picture, RAM-shaped
    Frames frames = 3; // a frame moved — raw bytes, never encoded
    Event event = 4;   // something happened — a record
  }
}

// The body's live state.
//
// EVERY field is `optional` on purpose. A daemon publishes only what it
// measured: without explicit presence, a motion reading carrying
// pir_high=false is indistinguishable from a message that never mentioned the
// PIR, and a partial update would silently clobber the fields it did not own
// with zero values. Presence is what makes "I have a reading for this" sayable.
message State {
  optional string mood = 1;
  optional double mood_set_at = 2;
  optional string ring_state = 3;
  optional string pending_event = 4;

  optional string oled_mode = 5;
  optional string oled_text = 6;
  optional bool oled_dim = 7;

  optional bool ripperdoc = 8;
  optional string ripperdoc_page = 9;
  optional string condition = 10;

  optional bool pir_high = 11;
  optional uint32 pir_count = 12;
  optional double pir_last_ts = 13;
  optional double pir_last_hold = 14;
  optional double pir_on_ts = 15;

  optional double snr_cm = 16;
  optional uint32 snr_count = 17;

  optional double temp_c = 18;
  optional double hum_pct = 19;
  optional double temp_ts = 20;

  optional double pressure_hpa = 21;
  optional double baro_temp_c = 22;
  optional double baro_ts = 23;

  optional double sense_ts = 24;
  optional uint32 sense_count = 25;

  // What the console needs but the state row does not carry. These travel on
  // the feed so a consumer never has to reach back over HTTP for them — that
  // reach-back is what made a "pub/sub" console secretly a poller.
  map<string, double> power = 26;   // PMIC rails as read on the BODY
  repeated string faults = 27;      // "level|label" per row, worst first
  map<string, string> frag = 28;    // the vault's seal state, as the body sees it
  optional string baro_trend = 29;  // rising|falling|steady, off the body's samples
  repeated double baro_series = 30; // the sparkline's points, oldest first
}

// A frame moved. RAW bytes — protobuf carries them, so no hex, no base64, and
// nothing to guess at. This is why the encoding is declared in the schema.
//
// NOT a consumer and not "the twin". This is the payload: the pixels the body
// is driving. "The twin" is the whole mirror a consumer assembles — State plus
// Frames — which is what twin.json used to be.
message Frames {
  bytes face = 1;   // 1024 bytes, 1bpp, the panel as driven
  bytes ring = 2;   // 72 bytes, 24 px RGB, as driven
}

// Something happened. detail is a string map, which keeps events to scalars:
// a bytes field here would be silently base64-encoded by the canonical JSON
// mapping, smuggling an encoding into the database where nobody looks for one.
// A frame event records the frame's HASH, never the frame.
message Event {
  double ts = 1;
  string kind = 2;
  map<string, string> detail = 3;
}
