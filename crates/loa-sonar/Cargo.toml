[package]
name = "loa-sonar"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the ultrasonic ranger daemon: TRIG 23 / ECHO 22, microsecond echo timing"

[dependencies]
loa-sense = { path = "../loa-sense" }
loa-wire = { path = "../loa-wire", features = ["async"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "time", "sync"] }
