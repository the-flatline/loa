[package]
name = "loa-motion"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "the PIR daemon: the body's eye, on GPIO17"

[dependencies]
loa-sense = { path = "../loa-sense" }
loa-wire = { path = "../loa-wire", features = ["async"] }
