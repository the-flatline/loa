<text x="56.0" y="592.0" fill="#20242a" font-size="12" text-anchor="start" font-weight="bold">before you wire it</text>
<text x="56.0" y="612.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Two trim pots — sensitivity and delay. Both fully anti-clockwise for minimum of each.</text>
<text x="56.0" y="629.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  The dome is 24 mm and overhangs roughly 12 breadboard columns while using 3.</text>
<text x="56.0" y="646.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Needs 30-60 s to settle after power-up. Early readings are garbage.</text>
