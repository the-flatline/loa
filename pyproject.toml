[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loa"
version = "0.9.0"
description = "loa cortex — ring + OLED drivers, moods, expressions, and the HTTP controller for the loa outpost (Raspberry Pi 5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "spidev>=3.5",
    "cryptography>=42",
    "pyzmq>=27.2.0",
    "protobuf>=7.36.1",
    "websockets>=17.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]
ripperdoc = ["textual>=0.60"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "cryptography>=42",
    "grpcio-tools>=1.83.1",
]

[project.scripts]
# Each daemon's entry lives in its package's `__main__`, so `python -m loa.motion`
# and the installed `loa-motion` run the SAME function.
#
# NO loa-oled AND NO loa-ring: those two daemons are Rust binaries now
# (rust/loa-panel, rust/loa-ring), installed to /usr/local/bin by
# scripts/deploy-panel.sh and scripts/deploy-ring.sh. Console scripts for them
# would be a second way to start a second implementation of the same display.
loa-cortex = "loa.cortex.__main__:main"
loa-motion = "loa.motion.__main__:main"
loa-sonar = "loa.sonar.__main__:main"
loa-weather = "loa.weather.__main__:main"
# NO ripperdoc: the console is the Rust binary at rust/ripperdoc, which the
# `ripperdoc` shim on PATH runs. A Python console script for it would be a second
# console over the same feed, drifting from the first.
loa-fault = "loa.fault.__main__:main"
loa-topic-tail = "loa.topic:main"

[tool.setuptools]
# loa.pb MUST be listed: it holds the GENERATED protobuf bindings, and a wheel
# built without it installs cleanly and then dies on `No module named loa.pb` at
# import. Found on the body 2026-09-13 — the source tree always had it, so only
# an install from git could show it. Every OTHER package is listed for the same
# reason: one directory per subsystem means an unlisted one installs clean and
# then dies on import.
packages = [
    "loa",
    "loa.pb",
    "loa.cortex",
    "loa.oled",
    "loa.ring",
    "loa.motion",
    "loa.sonar",
    "loa.weather",
    "loa.fault",
    "loa.vault",
    "loa.ripperdoc",
]
