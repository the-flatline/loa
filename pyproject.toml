[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loa"
version = "0.9.0"
description = "loa cortex — ring + OLED drivers, moods, expressions, and the HTTP controller for the loa outpost (Raspberry Pi 5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["spidev>=3.5", "cryptography>=42"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]
ripperdoc = ["textual>=0.60"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "cryptography>=42"]

[project.scripts]
loa-ring = "loa.ring:main"
loa-cortex = "loa.cortexd:main"
loa-ctl = "loa.control:serve"
loa-oled = "loa.oled_daemon:main"
loa-motion = "loa.motion:main"
loa-sonar = "loa.sonar:main"
loa-weather = "loa.weather:main"
ripperdoc = "loa.ripperdoc:main"
loa-fault = "loa.fault:main"

[tool.setuptools]
packages = ["loa"]