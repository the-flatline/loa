[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loa"
version = "0.9.0"
description = "loa cortex — ring + OLED drivers, moods, expressions, and the HTTP controller for the loa outpost (Raspberry Pi 5)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "spidev>=3.5",
    "cryptography>=42",
    "pyzmq>=27.2.0",
    "protobuf>=7.36.1",
    "websockets>=17.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "cryptography>=42"]
ripperdoc = ["textual>=0.60"]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "fastapi>=0.110",
    "cryptography>=42",
    "grpcio-tools>=1.83.1",
]

[project.scripts]
loa-ring = "loa.ring:main"
loa-cortex = "loa.cortexd:main"
loa-oled = "loa.oled:main"
loa-motion = "loa.motion:main"
loa-sonar = "loa.sonar:main"
loa-weather = "loa.weather:main"
ripperdoc = "loa.ripperdoc:main"
loa-fault = "loa.fault:main"
loa-topic-tail = "loa.topic:main"

[tool.setuptools]
# loa.pb MUST be listed: it holds the GENERATED protobuf bindings, and a wheel
# built without it installs cleanly and then dies on `No module named loa.pb` at
# import. Found on the body 2026-09-13 — the source tree always had it, so only
# an install from git could show it.
packages = ["loa", "loa.pb"]
