<text x="56.0" y="662.0" fill="#20242a" font-size="12" text-anchor="start" font-weight="bold">before you wire it</text>
<text x="56.0" y="682.0" fill="#d1490b" font-size="10.5" text-anchor="start" font-weight="normal">!  pin 1 5V: 1.44 A at full white (24 x 3 x 20 mA). Do not source this from a Pi header pin.</text>
<text x="56.0" y="699.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Brightness IS the current budget: 100% = 1.44 A, 50% = 0.72 A, 30% = 0.43 A, 20% = 0.29 A.</text>
<text x="56.0" y="716.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  330R in series with DIN, and 1000uF across 5V/GND right at the ring.</text>
<text x="56.0" y="733.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  GND must be common with whatever drives DIN or the data line has no reference.</text>
<text x="56.0" y="750.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Channel order is GRB, not RGB. Green and red swap if you assume RGB.</text>
<text x="40.0" y="790.0" fill="#8a867c" font-size="10" text-anchor="start" font-weight="normal">source: measured worst case, loa 2026-09-07</text></svg>