<rect x="40" y="506.0" width="740.0" height="79" rx="7" fill="#ffffff" stroke="#c9c2b1"/>
<text x="56.0" y="526.0" fill="#20242a" font-size="12" text-anchor="start" font-weight="bold">before you wire it</text>
<text x="56.0" y="546.0" fill="#d1490b" font-size="10.5" text-anchor="start" font-weight="normal">!  pin 3 ECHO: output swings to 5 V — a Pi GPIO is 3.3 V max. 1k/2.2k divider first.</text>
<text x="56.0" y="563.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Divider maths: 5 V x 2.2/(1+2.2) = 3.44 V. Close to the limit; 1k/2k is safer if you have it.</text>
<text x="56.0" y="580.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Needs a clear cone in front. Mounting it behind a grille or bezel wrecks the reading.</text>
<text x="40.0" y="654.0" fill="#8a867c" font-size="10" text-anchor="start" font-weight="normal">source: verified on the loa bench 2026-09-07</text></svg>