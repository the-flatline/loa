<text x="40.0" y="76.0" fill="#8a867c" font-size="12.5" text-anchor="start" font-weight="normal">Temperature and humidity module (DHT-series on a carrier)</text>
<text x="40.0" y="96.0" fill="#8a867c" font-size="11.5" text-anchor="start" font-weight="normal">body 23 x 20 mm  ·  3 pin  ·  2.54 mm pitch  ·  2 mA  ·  1-wire proprietary</text>
<text x="40.0" y="114.0" fill="#8a867c" font-size="10" text-anchor="start" font-weight="normal">body to scale (aspect + mm) · pin spacing enlarged for legibility</text>
