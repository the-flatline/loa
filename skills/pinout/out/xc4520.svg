<text x="258.0" y="503.5" fill="#3c3c3c" font-size="9.5" text-anchor="middle" font-weight="normal">GND</text>
<rect x="40" y="605.4782608695652" width="740.0" height="79" rx="7" fill="#ffffff" stroke="#c9c2b1"/>
<text x="56.0" y="625.5" fill="#20242a" font-size="12" text-anchor="start" font-weight="bold">before you wire it</text>
<text x="56.0" y="645.5" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Needs a 4.7k pull-up from DATA to VCC. Without it you get read timeouts, not an error.</text>
<text x="56.0" y="662.5" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Self-heats and reads high near a warm board. Keep it away from the Pi's thermal plume.</text>
<text x="56.0" y="679.5" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  One reading per 2 s maximum. Polling faster returns the cached sample.</text>
<text x="40.0" y="753.0" fill="#8a867c" font-size="10" text-anchor="start" font-weight="normal">source: Jaycar listing + loa bench 2026-09-07</text></svg>