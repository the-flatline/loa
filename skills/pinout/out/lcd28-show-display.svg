<rect x="40" y="662" width="1090.0" height="130" rx="7" fill="#ffffff" stroke="#c9c2b1"/>
<text x="56.0" y="682.0" fill="#20242a" font-size="12" text-anchor="start" font-weight="bold">before you wire it</text>
<text x="56.0" y="702.0" fill="#d1490b" font-size="10.5" text-anchor="start" font-weight="normal">!  pin 11 TP_IRQ: GPIO17 — touch controller drives this. Collides with anything else on pin 11.</text>
<text x="56.0" y="719.0" fill="#d1490b" font-size="10.5" text-anchor="start" font-weight="normal">!  pin 16 KEY2: GPIO23 — a physical button. Anything else here gets shorted when pressed.</text>
<text x="56.0" y="736.0" fill="#d1490b" font-size="10.5" text-anchor="start" font-weight="normal">!  pin 18 KEY3: GPIO24 — a physical button. Same problem as KEY2.</text>
<text x="56.0" y="753.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Numbers here are Pi HEADER pins, not module pins — this is a map of what the display takes away from you.</text>
<text x="56.0" y="770.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Uses nothing above pin 26, so pins 29-40 stay free. That is where sensor signals should go.</text>
<text x="56.0" y="787.0" fill="#20242a" font-size="10.5" text-anchor="start" font-weight="normal">·  Also takes 1/17 (3V3), 2/4 (5V) and 6/9/14/20/25 (GND).</text>
<text x="40.0" y="810.0" fill="#8a867c" font-size="10" text-anchor="start" font-weight="normal">source: https://www.lcdwiki.com/2.8inch_RPi_Display (pin interface table)</text></svg>